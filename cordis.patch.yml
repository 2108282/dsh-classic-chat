# 1. 物理屏蔽真正导致卡顿与 DOM 回流雪崩的原生聊天渲染器 (ui-chat)
# 保留底层的 ui-conversation，确保 workflow-run、skill、schedule 等 10 个业务插件正常激活
- id: ui-chat
  disabled: true

# 2. 挂载我们全自包含的经典极速对话窗插件（自带完整聊天渲染与平滑打字机）
- insert:
    - id: classic-chat
      name: 'dsh-classic-chat'
      config:
        mode: typewriter
        preset: balanced
        revealCharsPerSec: 80
        scrollSpeedPxPerSec: 48
        maxScrollSpeedPxPerSec: 1000
