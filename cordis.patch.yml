# 1. 物理屏蔽官方引起全局回流与流式卡顿的对话组件
- id: ui-conversation
  disabled: true

- id: ui-chat
  disabled: true

# 2. 挂载完整的平滑打字机与零重排跟随引擎
- insert:
    - id: smooth-stream
      name: dsh-smooth-stream
      config:
        mode: typewriter
        preset: balanced
        revealCharsPerSec: 80
        scrollSpeedPxPerSec: 48
        maxScrollSpeedPxPerSec: 1000
